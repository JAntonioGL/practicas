services:
  api_node24_experimentojs:
    build: .
    container_name: api_node24_experimetojs
    ports:
      - "3000:3000"
    volumes:
      - ./index.js:/home/app/index.js
      - ./src:/home/app/src
      - ./utils:/home/app/utils
      - ./package.json:/home/app/package.json

    networks:
      - experimento_network

networks:
  experimento_network:
    driver: bridge
